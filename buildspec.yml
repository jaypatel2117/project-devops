version: 0.2

# AWS CodeBuild spec
# Runs unit tests, builds Docker images, pushes to ECR, writes deployment artifacts.

env:
  variables:
    IMAGE_TAG_FRONTEND: "frontend"
    IMAGE_TAG_BACKEND:  "backend"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - cd app/backend  && npm ci && cd ../..
      - cd app/frontend && npm ci && cd ../..

  pre_build:
    commands:
      - echo "Running unit tests..."
      - cd app/backend  && npm test --passWithNoTests 2>&1 | tail -20 && cd ../..
      - cd app/frontend && npm test -- --watchAll=false --passWithNoTests 2>&1 | tail -20 && cd ../..

      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "Image tag is $IMAGE_TAG"

      # Trivy security scan — warn only (non-blocking for now)
      - |
        if command -v trivy &> /dev/null; then
          trivy --version
        else
          wget -qO- https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin v0.48.0
        fi

  build:
    commands:
      - echo "Building Frontend Docker image..."
      - docker build -t $FRONTEND_REPO:$IMAGE_TAG --build-arg REACT_APP_API_URL=/api app/frontend/
      - docker tag $FRONTEND_REPO:$IMAGE_TAG $FRONTEND_REPO:latest

      - echo "Building Backend Docker image..."
      - docker build -t $BACKEND_REPO:$IMAGE_TAG app/backend/
      - docker tag $BACKEND_REPO:$IMAGE_TAG $BACKEND_REPO:latest

      - echo "Scanning images for vulnerabilities..."
      - trivy image --exit-code 0 --severity HIGH,CRITICAL $FRONTEND_REPO:$IMAGE_TAG || true
      - trivy image --exit-code 0 --severity HIGH,CRITICAL $BACKEND_REPO:$IMAGE_TAG  || true

  post_build:
    commands:
      - echo "Pushing images to ECR..."
      - docker push $FRONTEND_REPO:$IMAGE_TAG
      - docker push $FRONTEND_REPO:latest
      - docker push $BACKEND_REPO:$IMAGE_TAG
      - docker push $BACKEND_REPO:latest

      - echo "Writing imagedefinitions.json for CodeDeploy..."
      - |
        cat > imagedefinitions.json <<EOF
        [
          {"name":"frontend","imageUri":"${FRONTEND_REPO}:${IMAGE_TAG}"},
          {"name":"backend","imageUri":"${BACKEND_REPO}:${IMAGE_TAG}"}
        ]
        EOF

      - echo "Writing taskdef.json for CodeDeploy Blue/Green..."
      - |
        # Substitute the image URIs into the task definition template
        sed -e "s|IMAGE_NAME_FRONTEND|${FRONTEND_REPO}:${IMAGE_TAG}|g" \
            -e "s|IMAGE_NAME_BACKEND|${BACKEND_REPO}:${IMAGE_TAG}|g" \
            taskdef-template.json > taskdef.json

      - echo "Build complete."

artifacts:
  files:
    - imagedefinitions.json
    - taskdef.json
    - appspec.yml
  discard-paths: yes

reports:
  jest-reports:
    files:
      - "app/backend/coverage/junit.xml"
    file-format: JUNITXML
