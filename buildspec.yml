version: 0.2

env:
  variables:
    IMAGE_TAG_FRONTEND: "frontend"
    IMAGE_TAG_BACKEND:  "backend"

phases:
  install:
    runtime-versions:
      nodejs: 20
    commands:
      - echo "Installing dependencies..."
      - cd app/backend  && npm ci && cd ../..
      - cd app/frontend && npm ci && cd ../..

  pre_build:
    commands:
      - echo "Logging in to ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com
      - COMMIT_HASH=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c 1-8)
      - IMAGE_TAG=${COMMIT_HASH:-latest}
      - echo "Image tag $IMAGE_TAG"

  build:
    commands:
      - echo "Building Frontend Docker image..."
      - docker build -t $FRONTEND_REPO:$IMAGE_TAG --build-arg REACT_APP_API_URL=/api app/frontend/
      - docker tag $FRONTEND_REPO:$IMAGE_TAG $FRONTEND_REPO:latest

      - echo "Building Backend Docker image..."
      - docker build -t $BACKEND_REPO:$IMAGE_TAG app/backend/
      - docker tag $BACKEND_REPO:$IMAGE_TAG $BACKEND_REPO:latest

  post_build:
    commands:
      - echo "Pushing images to ECR..."
      - docker push $FRONTEND_REPO:$IMAGE_TAG
      - docker push $FRONTEND_REPO:latest
      - docker push $BACKEND_REPO:$IMAGE_TAG
      - docker push $BACKEND_REPO:latest

      - |
        set -e
        NAME_PREFIX=$(echo $FRONTEND_REPO | awk -F'/' '{print $(NF-1)}')
        CLUSTER_NAME="${NAME_PREFIX}-cluster"
        SERVICE_NAME="${NAME_PREFIX}-service"
        echo "Fetching task definition from cluster=$CLUSTER_NAME service=$SERVICE_NAME"

        TASK_DEF_ARN=$(aws ecs describe-services \
          --cluster "$CLUSTER_NAME" \
          --services "$SERVICE_NAME" \
          --region "$AWS_DEFAULT_REGION" \
          --query 'services[0].taskDefinition' \
          --output text)
        echo "Task def ARN: $TASK_DEF_ARN"

        aws ecs describe-task-definition \
          --task-definition "$TASK_DEF_ARN" \
          --region "$AWS_DEFAULT_REGION" \
          --query 'taskDefinition' \
          | jq 'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,.compatibilities,.registeredAt,.registeredBy)' \
          > base-taskdef.json

        jq --arg fe "${FRONTEND_REPO}:${IMAGE_TAG}" \
           --arg be "${BACKEND_REPO}:${IMAGE_TAG}" \
           '(.containerDefinitions[] | select(.name=="frontend") | .image) |= $fe |
            (.containerDefinitions[] | select(.name=="backend")  | .image) |= $be' \
           base-taskdef.json > taskdef.json

        echo "taskdef.json written:"
        cat taskdef.json | jq '[.containerDefinitions[].image]'

      - |
        cat > imagedefinitions.json << EOF
        [
          {"name":"frontend","imageUri":"${FRONTEND_REPO}:${IMAGE_TAG}"},
          {"name":"backend","imageUri":"${BACKEND_REPO}:${IMAGE_TAG}"}
        ]
        EOF

      - echo "Build complete."

artifacts:
  files:
    - imagedefinitions.json
    - taskdef.json
    - appspec.yml
  discard-paths: yes
