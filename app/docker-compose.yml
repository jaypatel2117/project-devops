version: "3.9"

services:
  db:
    image: postgres:15-alpine
    container_name: retail-db
    environment:
      POSTGRES_DB:       retaildb
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: retail-backend
    environment:
      PORT:         3001
      DB_HOST:      db
      DB_PORT:      5432
      DB_NAME:      retaildb
      DB_USER:      postgres
      DB_PASSWORD:  postgres
      DB_SSL:       "false"
      CORS_ORIGIN:  "http://localhost:80"
    ports:
      - "3001:3001"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: /api
    container_name: retail-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
